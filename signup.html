<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - SkyStay Hotel</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">SkyStay</div>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="rooms.html" class="nav-link">Rooms</a></li>
          <li id="my-bookings-link" class="hidden"><a href="my-bookings.html" class="nav-link">My Bookings</a></li>
          <li id="login-link"><a href="login.html" class="nav-link">Login</a></li>
          <li id="signup-link"><a href="signup.html" class="nav-link active">Sign Up</a></li>
          <li id="logout-link" class="hidden"><a href="#" class="nav-link">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="form-container">
        <h1>Sign Up</h1>
        <form id="signup-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
          </div>
          <button type="submit" class="form-submit">Sign Up</button>
        </form>
        <p class="text-center mt-4">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      updateNavigation();
      
      // Redirect if already logged in
      if (isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }

      const signupForm = document.getElementById('signup-form');
      signupForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // Validate passwords match
        if (password !== confirmPassword) {
          alert('Passwords do not match');
          return;
        }

        try {
          const response = await fetch('http://localhost:3000/api/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, email, password })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Registration failed');
          }

          // Automatically log in after successful registration
          const loginResponse = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          const loginData = await loginResponse.json();

          if (!loginResponse.ok) {
            throw new Error(loginData.error || 'Login failed');
          }

          // Store the token and user data
          localStorage.setItem('token', loginData.token);
          localStorage.setItem('user', JSON.stringify(loginData.user));

          // Redirect to home page
          window.location.href = 'index.html';
        } catch (error) {
          console.error('Error:', error);
          alert(error.message);
        }
      });
    });
  </script>
</body>
</html>
